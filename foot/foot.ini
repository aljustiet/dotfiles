[main]
font = JetBrainsMono Nerd Font:size=16

[bell]
urgent = yes
notify = yes
visual = yes

[scrollback]
lines = 1024

[colors-dark]
background = 282828
foreground = ebdbb2
regular0   = 282828
regular1   = cc241d
regular2   = 98971a
regular3   = d79921
regular4   = 458588
regular5   = b16286
regular6   = 689d6a
regular7   = a89984
bright0    = 928374
bright1    = fb4934
bright2    = b8bb26
bright3    = fabd2f
bright4    = 83a598
bright5    = d3869b
bright6    = 8ec07c
bright7    = ebdbb2

[key-bindings]
scrollback-up-line        = Control+e
scrollback-down-line      = Control+a
scrollback-up-page        = Alt+e Page_Up
scrollback-up-half-page   = Alt+Shift+e Shift+Page_Up
scrollback-down-page      = Alt+a Page_Down
scrollback-down-half-page = Alt+Shift+a Shift+Page_Down
scrollback-home           = Home
scrollback-end            = End
show-urls-copy            = Control+Shift+e

[search-bindings]
find-prev = Control+r
find-next = Control+t
