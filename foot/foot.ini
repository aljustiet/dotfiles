[main]
font = JetBrainsMono Nerd Font:size=16

[bell]
urgent = yes
notify = yes
visual = yes

[scrollback]
lines = 1024

[colors-dark]
background = fbf1c7
foreground = 3c3836
regular0   = fbf1c7
regular1   = cc241d
regular2   = 98971a
regular3   = d79921
regular4   = 458588
regular5   = b16286
regular6   = 689d6a
regular7   = 7c6f64
bright0    = 928374
bright1    = 9d0006
bright2    = 79740e
bright3    = b57614
bright4    = 076678
bright5    = 8f3f81
bright6    = 427b58
bright7    = 3c3836

[key-bindings]
scrollback-up-line        = Control+e
scrollback-down-line      = Control+a
scrollback-up-page        = Alt+e Page_Up
scrollback-up-half-page   = Alt+Shift+e Shift+Page_Up
scrollback-down-page      = Alt+a Page_Down
scrollback-down-half-page = Alt+Shift+a Shift+Page_Down
scrollback-home           = Home
scrollback-end            = End
show-urls-copy            = Control+Shift+e

[search-bindings]
find-prev = Control+r
find-next = Control+t
